name: Android satellite

on:
  push:
    paths:
      - "voiceagent/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voiceagent/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so this APK is signed with a throwaway key and installing it over an older build needs an uninstall first. See voiceagent/android/README.md."
          fi

      - name: Test and build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/voiceagent-satellite-0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: voiceagent-satellite
          path: voiceagent/android/dist/*.apk

      # Builds from the default branch are normal releases; other branches are
      # marked pre-release so Obtainium only picks them up if asked to.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: satellite-v0.1.${{ github.run_number }}
          name: Satellite 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != github.event.repository.default_branch }}
          body: "Android satellite built from ${{ github.ref_name }} at ${{ github.sha }}. Open this page on the phone and tap the APK to install."
          files: voiceagent/android/dist/*.apk
